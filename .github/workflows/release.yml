name: Release

# One merge releases one version. Merging an MR into `master` starts a run that bumps `version`
# in gradle.properties, pushes that bump commit to `master`, uploads the new version to the JetBrains
# Marketplace and commits the stamped CHANGELOG.md section back to `master`. There is no bump PR and
# no second merge: the release is complete when the check on the merged MR goes green.
#
# `CHANGELOG.md` is never written by a workflow step: `patchChangelog` is a dependency of `publishPlugin`
# (org/jetbrains/intellij/platform/gradle/plugins/changelog.kt:28-30) and it turns `## Unreleased` into
# `## <version> - <date>` with the plugin's default header `${version} - ${date()}`; the step below only
# commits what Gradle produced. The uploaded change notes come from that same stamped section
# (changelog.kt:57-58 -> getOrNull(version) ?: getUnreleased()).
#
# `version` is bumped and pushed to `master` *before* the upload, because that push is the claim on
# the number: two MRs merged back to back would otherwise read the same `master` tip and compute the
# same version. The price is a `master` whose version is not uploaded yet when the upload fails;
# `workflow_dispatch` with mode=publish finishes such a release without another bump.
#
# The heading stamped into CHANGELOG.md doubles as the record that a version was already published,
# which is what the duplicate-upload guard reads: the Marketplace refuses an upload of a version it has
# already, and an interrupted publish would otherwise retry it. An empty `## Unreleased` section makes
# patchChangelog skip itself through StopActionException (changelog/tasks/PatchChangelogTask.kt:118-121)
# without failing the build: such a release ships with empty change notes and gets no heading, and the
# last step warns about it.
#
# Requires two repository secrets: `JB_MARKETPLACE_TOKEN` (build.gradle.kts reads that exact variable
# name as the intellijPlatform.publishing token) and `MASTER_PUSH_TOKEN` (a fine-grained PAT of the repo
# owner, passed to the checkout so both writes to `master` - the bump commit, then the stamped changelog -
# push as an account the `master` ruleset lets bypass: the repo admin). The default GITHUB_TOKEN cannot
# push: the GitHub Actions app cannot become a ruleset bypass actor on a personal account ("Actor GitHub
# Actions integration must be part of the ruleset source or owner organization"), and classic branch
# protection offers no bypass list outside organizations. A push by that owner starts no further run -
# this workflow triggers on PR close and manual dispatch only - which is fine because a run publishes
# the version it bumped to and never waits for a follow-up run.

on:
  pull_request:
    branches: [master]
    # Only the end of an MR's life carries information here: a merge is a release, an open or
    # force-pushed PR is not. Without this filter every push to a PR branch queues a run whose
    # only job is skipped by the guard below, which shows up as a "skipped check" on the PR.
    types: [closed]
  workflow_dispatch:
    inputs:
      mode:
        description: "release = bump the version in master and publish that; publish = publish the version already in master (re-run of an interrupted release)"
        required: true
        default: release
        options: [release, publish]

permissions:
  contents: write # API scope for the run; the two master pushes authenticate with MASTER_PUSH_TOKEN

jobs:
  release:
    # A closed PR that was not merged has nothing to release.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The merged state of master, not the PR head: the release is what master ended up with.
          ref: ${{ github.event.pull_request.merge_commit_sha || 'master' }}
          fetch-depth: 0
          # persist-credentials (default true) writes this token into the remote URL, so the bare
          # `git push origin HEAD:refs/heads/master` below pushes as the owner, not as the Actions app.
          token: ${{ secrets.MASTER_PUSH_TOKEN }}

      - uses: actions/setup-java@v6
        with:
          distribution: oracle
          # IntelliJ 2023.3 -> Java 17. The IntelliJ Platform Gradle Plugin pins the compile
          # toolchain to that regardless of the runner JDK; this only needs to run Gradle 9.6.1.
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Decide the mode
        id: decide
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          v=$(grep -m1 '^version=' gradle.properties | cut -d= -f2)
          printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "::error::version '$v' is not MAJOR.MINOR.PATCH"
            exit 1
          }
          requested=${REQUESTED_MODE:-}
          if [ -n "$requested" ]; then
            mode=$requested
          else
            # Merging an MR is the whole release: bump first, then upload what was bumped to.
            mode=release
            case "${HEAD_REF:-}" in
              release/*)
                # Bump PRs are no longer opened or merged, so such a branch is a leftover from the
                # previous flow: merging it only moves an unpublished version into master, and this run
                # publishes the bump on top of it. Close the branch instead of merging it.
                echo "::warning::merged a leftover ${HEAD_REF} branch: master now carries v${v}, and this run publishes the bump on top of it"
                ;;
            esac
          fi
          {
            echo "version in gradle.properties: $v"
            echo "merged from: ${HEAD_REF:-workflow_dispatch}"
            echo "mode: $mode"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Test
        run: ./gradlew test --no-daemon

      - name: Release notes present?
        run: |
          set -euo pipefail
          notes=$(awk '/^## Unreleased[[:space:]]*$/{s=1;next} s&&/^## /{exit} s&&NF{n++} END{print n+0}' CHANGELOG.md)
          echo "Unreleased bullet lines: $notes" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$notes" -eq 0 ]; then
            echo "No release notes: the Marketplace entry gets empty change notes and CHANGELOG.md gets no heading." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Bump the version on master
        if: steps.decide.outputs.mode == 'release'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          pushed=0
          for attempt in 1 2 3 4 5; do
            # Another MR may have merged while this run was building: branch off current master, and read
            # the version from it, so two runs cannot compute the same bump.
            git fetch --quiet origin master:refs/remotes/origin/master
            git reset --hard refs/remotes/origin/master
            current=$(grep -m1 '^version=' gradle.properties | cut -d= -f2)
            IFS=. read -r major minor patch <<< "$current"
            new="$major.$minor.$((patch + 1))"
            # No `sed -i`: that flag needs an extra argument on BSD/macOS, and this form behaves
            # identically on a local run and on the runner.
            sed "s/^version=.*/version=$new/" gradle.properties > gradle.properties.tmp
            mv gradle.properties.tmp gradle.properties
            # Only gradle.properties is committed: CHANGELOG.md is stamped by Gradle in the publish step.
            git add gradle.properties
            git commit --quiet -m "chore: bump version to $new"
            out=$(git push --quiet origin "HEAD:refs/heads/master" 2>&1) && rc=0 || rc=$?
            if [ $rc -eq 0 ]; then
              echo "version: $current -> $new" | tee -a "$GITHUB_STEP_SUMMARY"
              pushed=1
              break
            fi
            printf '%s\n' "$out"
            # A protection rejection would repeat on every attempt - it is not master moving, and the
            # 2026-11-10 release run burned all five retries on the same GH006. Fail with the cause.
            if printf '%s' "$out" | grep -qiE 'GH006|protected branch|must be made through a pull request|repository rule violations'; then
              echo "::error::branch protection rejected the push by MASTER_PUSH_TOKEN's owner - check that the classic master rule was deleted and the \`master\` ruleset lets the repo admin bypass" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "master moved during the run: recomputing the bump (attempt $attempt)" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          [ "$pushed" = 1 ] || { echo "::error::could not push the bump commit to master"; exit 1; }

      - name: Publish to the JetBrains Marketplace
        env:
          JB_MARKETPLACE_TOKEN: ${{ secrets.JB_MARKETPLACE_TOKEN }}
        run: |
          set -euo pipefail
          # master already holds the version being published: in release mode the bump commit above was
          # pushed, so this checkout sits on the master tip.
          v=$(grep -m1 '^version=' gradle.properties | cut -d= -f2)
          echo "publishing v$v (master tip $(git rev-parse --short HEAD))" | tee -a "$GITHUB_STEP_SUMMARY"
          # The heading committed by an earlier publish is the record that a version is already uploaded.
          if grep -q "^## $v - " CHANGELOG.md; then
            echo "CHANGELOG.md already has a section for v$v: already published, skipping the upload." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            set +e
            out=$(./gradlew publishPlugin --no-daemon 2>&1)
            rc=$?
            set -e
            printf '%s\n' "$out"
            if [ $rc -ne 0 ] && printf '%s' "$out" | grep -qiE 'exists already|already exists|same version'; then
              echo "v$v is already on the Marketplace: skipping the upload." | tee -a "$GITHUB_STEP_SUMMARY"
            elif [ $rc -ne 0 ]; then
              printf '%s\n' "$out" >&2
              exit 1
            fi
          fi

      - name: Commit the stamped changelog to master
        run: |
          set -euo pipefail
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md was not stamped: patchChangelog skipped (empty release notes) or the section already existed." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          v=$(grep -m1 '^version=' gradle.properties | cut -d= -f2)
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # patchChangelog ran as a dependency of publishPlugin and stamped the file in the checkout.
          git add CHANGELOG.md
          git commit --quiet -m "docs: changelog for v$v"
          # A rejected push here means either another release raced this one (replay the changelog
          # commit instead of forcing over it) or protection rejected the push (replaying cannot help):
          # tell the two apart from the remote's own message.
          out=$(git push --quiet origin "HEAD:refs/heads/master" 2>&1) && rc=0 || rc=$?
          if [ $rc -ne 0 ]; then
            printf '%s\n' "$out"
            if printf '%s' "$out" | grep -qiE 'GH006|protected branch|must be made through a pull request|repository rule violations'; then
              echo "::error::branch protection rejected the push by MASTER_PUSH_TOKEN's owner - fix the \`master\` ruleset bypass, then re-run with mode=publish" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            git fetch --quiet origin master:refs/remotes/origin/master
            if git rebase --quiet refs/remotes/origin/master; then
              git push --quiet origin "HEAD:refs/heads/master" || {
                echo "::error::master keeps moving - commit the stamped CHANGELOG.md by hand or re-run with mode=publish"
                exit 1
              }
            else
              echo "::error::CHANGELOG.md conflicts with a concurrent release - re-run with mode=publish"
              git rebase --abort || true
              exit 1
            fi
          fi

      - name: Confirm the changelog has a heading for the published version
        run: |
          set -euo pipefail
          v=$(grep -m1 '^version=' gradle.properties | cut -d= -f2)
          echo "Published version: $v" | tee -a "$GITHUB_STEP_SUMMARY"
          grep -q "^## $v - " CHANGELOG.md \
            || echo "::warning::CHANGELOG.md has no heading for $v - the release note is missing or patchChangelog was skipped" >> "$GITHUB_STEP_SUMMARY"
